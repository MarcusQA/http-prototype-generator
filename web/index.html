<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTTP prototype</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}h1{margin:0 0 6px;font-size:30px}p{margin:0;color:#5b6475}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.banner{background:#fff8e8;border:1px solid #ead7a4;border-radius:10px;padding:12px 14px;margin-bottom:18px;color:#624b13}.banner strong{display:block;margin-bottom:5px}.banner code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.meta{font-size:12px;color:#788296;margin:0 0 18px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:14px;box-shadow:0 2px 8px rgba(20,32,50,.05);margin:0 0 18px;overflow:hidden}.card-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #e9edf3}.method{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef2f7;padding:5px 8px;border-radius:7px}.title{font-weight:700;flex:1}.url{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#4f5d75;overflow-wrap:anywhere}.actions{display:flex;gap:8px}.btn{display:inline-block;border:1px solid #cfd6e2;background:#fff;color:#172033;text-decoration:none;border-radius:8px;padding:8px 11px;font-weight:650;cursor:pointer;font:inherit}.btn.primary{background:#172033;color:white;border-color:#172033}.btn:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0}.pane{padding:16px 18px;min-width:0}.pane+.pane{border-left:1px solid #e9edf3}.section{margin-bottom:16px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#788296;font-weight:750;margin-bottom:7px}pre{margin:0;padding:12px;background:#f7f9fc;border:1px solid #e4e9f0;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:300px;overflow:auto}.response.empty{color:#8b94a5}.status{font-weight:750;margin-bottom:8px}.error{color:#a32222}.ok{color:#17693a}@media(max-width:800px){.top{display:block}.top-actions{margin-top:14px}.grid{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid #e9edf3}.actions{margin-top:12px}.card-head{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>HTTP prototype</h1><p>CSV-defined localhost requests and responses. JSON and query matching are semantic, and generated URLs always use the ports allocated to this running instance.</p></div>
    <div class="top-actions"><a class="btn" href="/api/export/postman">Download Postman / Bruno collection</a></div>
  </div>
  <div id="port-banner"></div>
  <div id="meta" class="meta"></div>
  <div id="list"></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const headersText=hs=>(hs||[]).map(h=>`${h.name}: ${h.value}`).join('\n') || '(none)';
async function load(){
 const [infoRes,rowsRes]=await Promise.all([fetch('/api/info'),fetch('/api/interactions')]);
 if(!infoRes.ok||!rowsRes.ok) throw new Error('Could not load prototype data');
 const info=await infoRes.json(), rows=await rowsRes.json();
 renderInfo(info);
 document.querySelector('#list').innerHTML=rows.map(render).join('');
}
function renderInfo(info){
 const remapped=(info.portMappings||[]).filter(x=>x.requested!==x.effective);
 const uiRemapped=info.requestedUiPort>0&&info.requestedUiPort!==info.uiPort;
 const messages=[];
 for(const m of remapped) messages.push(`Mock port <code>${m.requested}</code> → <code>${m.effective}</code>`);
 if(uiRemapped) messages.push(`UI port <code>${info.requestedUiPort}</code> → <code>${info.uiPort}</code>`);
 document.querySelector('#port-banner').innerHTML=messages.length?`<div class="banner"><strong>Some requested ports were already in use, so free localhost ports were selected automatically.</strong>${messages.join('<br>')}<br>Generated cURLs and exported collections use these effective ports.</div>`:'';
 document.querySelector('#meta').textContent=`Build ${info.buildId} · ${info.csv}`;
}
function render(r){
 const label=r.name?esc(r.name):`Request ${r.id}`;
 const portNote=r.effectivePort!==r.port?` <span title="Requested port ${r.port}; automatically remapped">(requested ${r.port})</span>`:'';
 return `<article class="card" id="row-${r.id}">
  <div class="card-head"><span class="method">${esc(r.method)}</span><div class="title">${label}<div class="url">${esc(r.url)}${portNote}</div></div><div class="actions"><button class="btn" onclick="copyCurl(${r.id})">Copy cURL</button><button class="btn primary" id="send-${r.id}" onclick="sendReq(${r.id})">Send</button></div></div>
  <div class="grid">
   <section class="pane">
    <div class="section"><div class="label">Request headers</div><pre>${esc(headersText(r.requestHeaders))}</pre></div>
    <div class="section"><div class="label">Request body</div><pre>${esc(r.requestBodyDisplay||'(empty)')}</pre></div>
    <div class="section"><div class="label">cURL</div><pre id="curl-${r.id}">${esc(r.curl)}</pre></div>
   </section>
   <section class="pane">
    <div class="section"><div class="label">Configured response</div><div class="status">${r.statusCode}</div><pre>${esc(headersText(r.responseHeaders))}</pre></div>
    <div class="section"><div class="label">Configured response body</div><pre>${esc(r.responseBodyDisplay||'(empty)')}</pre></div>
    <div class="section"><div class="label">Actual response</div><div id="result-${r.id}" class="response empty">Not sent yet.</div></div>
   </section>
  </div>
 </article>`;
}
async function copyCurl(id){
 const text=document.querySelector(`#curl-${id}`).textContent;
 await navigator.clipboard.writeText(text);
 const btn=document.querySelector(`#row-${id} .btn`); const old=btn.textContent; btn.textContent='Copied'; setTimeout(()=>btn.textContent=old,900);
}
async function sendReq(id){
 const btn=document.querySelector(`#send-${id}`), box=document.querySelector(`#result-${id}`); btn.disabled=true; box.className='response'; box.textContent='Sending…';
 try{
  const res=await fetch(`/api/execute?id=${id}`,{method:'POST'}); const text=await res.text();
  if(!res.ok){box.className='response error'; box.innerHTML=`<pre>${esc(text)}</pre>`; return}
  const x=JSON.parse(text); const hs=Object.entries(x.headers||{}).flatMap(([k,vs])=>vs.map(v=>`${k}: ${v}`)).join('\n');
  box.className=`response ${x.statusCode>=200&&x.statusCode<400?'ok':''}`;
  box.innerHTML=`<div class="status">${esc(x.status)} · ${x.durationMs} ms</div><pre>${esc(hs||'(none)')}</pre><div style="height:8px"></div><pre>${esc(x.bodyDisplay||x.body||'(empty)')}</pre>`;
 }catch(e){box.className='response error'; box.textContent=e.message} finally{btn.disabled=false}
}
load().catch(e=>document.querySelector('#list').innerHTML=`<div class="error">${esc(e.message)}</div>`);
</script>
</body>
</html>
